# ---------------------------------------------------------------------------
# DeskTop 发布通道 —— nginx 站点配置（可选方案 B）
#
# 放置位置（Debian）: /etc/nginx/conf.d/desktop-release.conf
#   Debian 的 nginx.conf 默认 include /etc/nginx/conf.d/*.conf
#   （若你的发行版只 include sites-enabled/，改放到 sites-enabled/ 并建软链）
#
# 生效前必须 nginx -t，通过后再 systemctl reload nginx。
#
# 与方案 A（serve-release.py）的二选一关系：
#   两者都监听 9090、都提供同一份目录，同时开会端口冲突。
#   本配置只在服务器能拿到 nginx 包时使用 —— 见部署文档「方案 B」的离线安装说明。
# ---------------------------------------------------------------------------

server {
    listen       9090;
    listen       [::]:9090;
    server_name  _;

    # /win/ 映射到 /data/chenzhixu/DeskTop-release/win/
    root /data/chenzhixu/DeskTop-release;

    # 不对外暴露"服务器上有哪些版本"。需要浏览时改 on。
    autoindex off;

    # ---- 版本清单：绝对不能被缓存 ----
    # electron-updater 靠轮询 latest.yml 感知新版本。一旦它被缓存或返回 304，
    # 客户端会长期停留在旧版本 —— 这是自建更新通道最典型的"上传成功但没人更新"故障。
    location = /win/latest.yml {
        default_type text/yaml;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        # 关掉协商缓存与压缩，确保每次都返回 200 + 完整正文
        etag off;
        if_modified_since off;
        gzip off;
    }

    # ---- 安装包 / blockmap：内容不可变，可长缓存 ----
    location /win/ {
        default_type application/octet-stream;
        # 文件名自带版本号，内容永不变化
        add_header Cache-Control "public, max-age=604800" always;
        # nginx 静态模块默认支持 Range（Accept-Ranges: bytes / 206），
        # electron-updater 依赖它做 blockmap 差量下载 —— 不要关闭。
        # 注意：gzip 会把响应改成 chunked 并丢掉 Range 语义，
        # 因此这里保持关闭（默认 gzip_types 也不含 exe/blockmap，显式写出来是防误改）。
        gzip off;
    }
}
